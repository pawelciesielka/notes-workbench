[package]
name = "amno-import"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Import Eksportu AMNO (All My Notes Organizer, HTML) do Skarbca Markdown"

[dependencies]
scraper = "0.23"
ego-tree = "0.10"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
html-escape = "0.2"
imagesize = "0.13"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
