[package]
name = "notes-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Serwer MCP (stdio, tylko do odczytu) dla Skarbca Notes Workbench"

[lib]
path = "src/lib.rs"

[[bin]]
name = "notes-mcp"
path = "src/main.rs"

[dependencies]
notes-core = { path = "../notes-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
