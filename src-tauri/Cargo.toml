[package]
name = "notes-workbench"
version = "0.1.0"
description = "Notes Workbench"
edition = "2021"

[lib]
name = "notes_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
amno-import = { path = "../crates/amno-import" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
fastembed = { version = "7.7", default-features = false, features = ["onnx", "ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
